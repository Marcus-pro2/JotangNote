<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JotangNote - 我的笔记</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: #ff6b6b; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .header h1 { font-size: 24px; }
        .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #333; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { background: #ff6b6b; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button:hover { background: #ff5252; }
        .note-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .note-item:hover { background: #f9f9f9; }
        .note-title { font-weight: bold; color: #333; }
        .note-time { font-size: 12px; color: #999; margin-top: 4px; }
        .chat-box { height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .msg { margin-bottom: 12px; padding: 10px; border-radius: 8px; max-width: 80%; }
        .msg.user { background: #e3f2fd; margin-left: auto; }
        .msg.ai { background: #f5f5f5; }
        .login-box { max-width: 400px; margin: 100px auto; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🍭 JotangNote</h1>
        <p>简单的笔记托管平台 + AI助手</p>
    </div>

    <!-- 登录界面 -->
    <div id="loginPage" class="login-box">
        <div class="card">
            <h2>登录</h2>
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <button onclick="login()" style="width:100%">登录 / 注册</button>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainPage" class="hidden">
        <div class="layout">
            <!-- 左边：笔记 -->
            <div class="card">
                <h2>📝 我的笔记</h2>
                <input type="text" id="noteTitle" placeholder="笔记标题">
                <textarea id="noteContent" rows="3" placeholder="笔记内容"></textarea>
                <button onclick="createNote()">新增笔记</button>
                <div id="noteList" style="margin-top:20px"></div>
            </div>

            <!-- 右边：AI聊天 -->
            <div class="card">
                <h2>🤖 AI助手</h2>
                <div class="chat-box" id="chatBox"></div>
                <input type="text" id="chatInput" placeholder="问点什么...比如：帮我看看第1篇笔记写了啥">
                <button onclick="sendChat()" style="width:100%">发送</button>
            </div>
        </div>
    </div>
</div>

<script>
let token = localStorage.getItem('token') || '';
const API = 'http://127.0.0.1:8080';

if (token) {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    loadNotes();
}

async function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    try {
        // 先尝试登录
        let res = await fetch(`${API}/users/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        if (!res.ok) {
            // 登录失败就注册
            res = await fetch(`${API}/users/register`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
        }
        const data = await res.json();
        token = data.access_token;
        localStorage.setItem('token', token);
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('mainPage').classList.remove('hidden');
        loadNotes();
    } catch (e) {
        alert('登录失败: ' + e);
    }
}

async function loadNotes() {
    try {
        const res = await fetch(`${API}/notes/1`, {headers: {'Authorization': `Bearer ${token}`}});
        if (res.ok) {
            const note = await res.json();
            document.getElementById('noteList').innerHTML = `
                <div class="note-item">
                    <div class="note-title">${note.title}</div>
                    <div class="note-time">${note.created_at}</div>
                    <div style="margin-top:8px;color:#666">${note.content}</div>
                </div>`;
        }
    } catch (e) {}
}

async function createNote() {
    const title = document.getElementById('noteTitle').value;
    const content = document.getElementById('noteContent').value;
    await fetch(`${API}/notes`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
        body: JSON.stringify({title, content})
    });
    alert('笔记创建任务已提交，等几秒刷新看看');
    setTimeout(loadNotes, 2000);
}

async function sendChat() {
    const input = document.getElementById('chatInput');
    const msg = input.value;
    if (!msg) return;
    addMsg('user', msg);
    input.value = '';

    const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
        body: JSON.stringify({message: msg})
    });
    const data = await res.json();
    addMsg('ai', data.reply);
}

function addMsg(type, text) {
    const box = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
